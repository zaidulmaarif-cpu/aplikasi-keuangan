<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Keuangan - Dark Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        borderDark: '#334155'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col font-sans">

    <header class="bg-cardBg border-b border-borderDark sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid font-bold text-emerald-400 text-2xl fa-wallet"></i>
                <h1 class="text-xl font-bold tracking-wide text-white">FinTrack <span class="text-xs px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Dark</span></h1>
            </div>
            <div class="text-sm text-slate-400">
                <i class="fa-regular fa-calendar-alt mr-1"></i> <span id="current-date"></span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="lg:col-span-2 space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-cardBg border border-borderDark p-5 rounded-xl shadow-lg">
                    <p class="text-xs text-slate-400 uppercase font-semibold">Total Saldo</p>
                    <h2 id="total-balance" class="text-2xl font-bold text-white mt-2">Rp 0</h2>
                </div>
                <div class="bg-cardBg border border-borderDark p-5 rounded-xl shadow-lg">
                    <p class="text-xs text-emerald-400 uppercase font-semibold">Total Pemasukan</p>
                    <h2 id="total-income" class="text-2xl font-bold text-emerald-400 mt-2">Rp 0</h2>
                </div>
                <div class="bg-cardBg border border-borderDark p-5 rounded-xl shadow-lg">
                    <p class="text-xs text-rose-400 uppercase font-semibold">Total Pengeluaran</p>
                    <h2 id="total-expense" class="text-2xl font-bold text-rose-400 mt-2">Rp 0</h2>
                </div>
            </div>

            <div class="bg-cardBg border border-borderDark p-5 rounded-xl shadow-lg">
                <h3 class="text-base font-semibold text-white mb-4"><i class="fa-solid fa-chart-pie mr-2 text-indigo-400"></i>Ringkasan Visual</h3>
                <div class="h-64 relative flex justify-center items-center">
                    <canvas id="financeChart"></canvas>
                </div>
            </div>

            <div class="bg-cardBg border border-borderDark p-5 rounded-xl shadow-lg">
                <h3 class="text-base font-semibold text-white mb-4"><i class="fa-solid fa-list mr-2 text-indigo-400"></i>Riwayat Transaksi</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-300">
                        <thead class="bg-slate-800 text-slate-400 uppercase text-xs border-b border-borderDark">
                            <tr>
                                <th class="py-3 px-4">Deskripsi</th>
                                <th class="py-3 px-4">Kategori</th>
                                <th class="py-3 px-4">Jumlah</th>
                                <th class="py-3 px-4 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-list" class="divide-y divide-borderDark">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="space-y-6">
            <div class="bg-cardBg border border-borderDark p-5 rounded-xl shadow-lg sticky top-24">
                <h3 class="text-base font-semibold text-white mb-4"><i class="fa-solid fa-plus-circle mr-2 text-emerald-400"></i>Tambah Transaksi</h3>
                <form id="transaction-form" class="space-y-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Deskripsi</label>
                        <input type="text" id="desc" required placeholder="Contoh: Gaji, Belanja Bulanan" 
                            class="w-full bg-slate-800 border border-borderDark rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Jumlah (Rp)</label>
                        <input type="number" id="amount" required placeholder="0" 
                            class="w-full bg-slate-800 border border-borderDark rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Tipe Transaksi</label>
                        <select id="type" 
                            class="w-full bg-slate-800 border border-borderDark rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                            <option value="income">Pemasukan (+)</option>
                            <option value="expense">Pengeluaran (-)</option>
                        </select>
                    </div>
                    <button type="submit" 
                        class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 px-4 rounded-lg transition duration-200 text-sm shadow-md">
                        Simpan Transaksi
                    </button>
                </form>
            </div>
        </div>

    </main>

    <footer class="bg-cardBg border-t border-borderDark py-4 text-center text-xs text-slate-500 mt-auto">
        <p>&copy; 2026 FinTrack Dark Edition. All rights reserved.</p>
    </footer>

    <script>
        // Tanggal Saat Ini
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });

        // State Transaksi (Mengambil dari LocalStorage)
        let transactions = JSON.parse(localStorage.getItem('fin_transactions')) || [];

        // Inisialisasi Chart.js
        const ctx = document.getElementById('financeChart').getContext('2d');
        let chart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Pemasukan', 'Pengeluaran'],
                datasets: [{
                    data: [0, 0],
                    backgroundColor: ['#10b981', '#f43f5e'],
                    borderColor: '#1e293b',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { color: '#94a3b8' } }
                }
            }
        });

        // Format Currency Rupiah
        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
        }

        // Update UI Summary & Chart
        function updateUI() {
            const income = transactions
                .filter(t => t.type === 'income')
                .reduce((acc, t) => acc + t.amount, 0);

            const expense = transactions
                .filter(t => t.type === 'expense')
                .reduce((acc, t) => acc + t.amount, 0);

            const balance = income - expense;

            document.getElementById('total-balance').innerText = formatRupiah(balance);
            document.getElementById('total-income').innerText = formatRupiah(income);
            document.getElementById('total-expense').innerText = formatRupiah(expense);

            // Render Table Rows
            const list = document.getElementById('transaction-list');
            list.innerHTML = '';

            if (transactions.length === 0) {
                list.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-slate-500">Belum ada transaksi.</td></tr>`;
            } else {
                transactions.forEach((t, index) => {
                    const row = document.createElement('tr');
                    const isIncome = t.type === 'income';
                    row.className = "hover:bg-slate-800/50 transition";
                    row.innerHTML = `
                        <td class="py-3 px-4 font-medium text-white">${t.desc}</td>
                        <td class="py-3 px-4">
                            <span class="px-2 py-1 text-xs rounded-full ${isIncome ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'}">
                                ${isIncome ? 'Pemasukan' : 'Pengeluaran'}
                            </span>
                        </td>
                        <td class="py-3 px-4 ${isIncome ? 'text-emerald-400' : 'text-rose-400'} font-semibold">
                            ${isIncome ? '+' : '-'}${formatRupiah(t.amount)}
                        </td>
                        <td class="py-3 px-4 text-center">
                            <button onclick="deleteTransaction(${index})" class="text-slate-500 hover:text-rose-400 transition">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    `;
                    list.appendChild(row);
                });
            }

            // Update Chart Data
            chart.data.datasets[0].data = [income, expense];
            chart.update();

            // Save to LocalStorage
            localStorage.setItem('fin_transactions', JSON.stringify(transactions));
        }

        // Tambah Transaksi
        document.getElementById('transaction-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const desc = document.getElementById('desc').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const type = document.getElementById('type').value;

            if (desc && !isNaN(amount) && amount > 0) {
                transactions.unshift({ desc, amount, type });
                updateUI();
                this.reset();
            }
        });

        // Hapus Transaksi
        function deleteTransaction(index) {
            transactions.splice(index, 1);
            updateUI();
        }

        // Initial Load
        updateUI();
    </script>
</body>
</html>
